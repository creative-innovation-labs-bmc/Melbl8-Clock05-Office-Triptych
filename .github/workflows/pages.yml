name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare production build
        run: |
          set -euo pipefail
          mkdir -p dist/assets/fonts
          cp index.html styles.css app.js core.js robots.txt .nojekyll dist/
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/creative-innovation-labs-bmc/Melbl8-Clock04-PT-Serif/main/assets/fonts/PT_Serif-Web-Bold.ttf \
            --output dist/assets/fonts/PT_Serif-Web-Bold.ttf
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/creative-innovation-labs-bmc/Melbl8-Clock04-PT-Serif/main/assets/fonts/OpenSans-Variable.ttf \
            --output dist/assets/fonts/OpenSans-Variable.ttf
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/creative-innovation-labs-bmc/Melbl8-Clock04-PT-Serif/main/assets/fonts/OFL-PT-Serif.txt \
            --output dist/assets/fonts/OFL-PT-Serif.txt
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/creative-innovation-labs-bmc/Melbl8-Clock04-PT-Serif/main/assets/fonts/OFL-Open-Sans.txt \
            --output dist/assets/fonts/OFL-Open-Sans.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
