<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="theme-color" content="#373A36">
  <title>Aurecon Office Triptych Clock</title>
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
  <main id="viewport" aria-label="Aurecon multilingual office clock">
    <section id="stage">
      <div class="panel panel-side" id="leftPanel" data-panel="left">
        <header class="panel-title" id="leftTitle"></header>
        <div class="message" id="leftMessage" lang="en">
          <div class="message-line" data-line="0"><span class="typed"></span><span class="cursor" hidden></span></div>
          <div class="message-line time-line" data-line="1"><span class="typed"></span><span class="cursor" hidden></span></div>
        </div>
      </div>

      <div class="panel panel-centre" id="centrePanel" data-panel="centre">
        <header class="panel-title" id="centreTitle"></header>
        <div class="message" id="centreMessage" lang="en-AU">
          <div class="message-line" data-line="0"><span class="typed"></span><span class="cursor" hidden></span></div>
          <div class="message-line time-line" data-line="1"><span class="typed"></span><span class="cursor" hidden></span></div>
        </div>
      </div>

      <div class="panel panel-side" id="rightPanel" data-panel="right">
        <header class="panel-title" id="rightTitle"></header>
        <div class="message" id="rightMessage" lang="en">
          <div class="message-line" data-line="0"><span class="typed"></span><span class="cursor" hidden></span></div>
          <div class="message-line time-line" data-line="1"><span class="typed"></span><span class="cursor" hidden></span></div>
        </div>
      </div>

      <div class="divider divider-one" aria-hidden="true"></div>
      <div class="divider divider-two" aria-hidden="true"></div>
      <div class="debug-grid" aria-hidden="true"></div>
    </section>

    <div id="rotatePrompt" class="rotate-prompt" hidden>
      <div class="rotate-icon" aria-hidden="true">↻</div>
      <p>Rotate your phone for the full gallery preview</p>
    </div>
  </main>
  <script type="module" src="app.js?v=1"></script>
</body>
</html>
